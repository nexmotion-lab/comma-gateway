apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - cluster-issuer.yaml

patches:
  - path: patch-env.yaml
  - path: patch-ingress.yaml

configMapGenerator:
  - behavior: merge
    files:
      - application-prod.yml
    name: gateway-config

secretGenerator:
  - name: cloudflare-api-key
    literals:
      - api-key=$(CLOUDFLARE_API_KEY)
